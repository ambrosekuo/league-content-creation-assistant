# Cloud Workflow: process-clips → process-portraits for one VOD.
# Deploy: ./deploy/deploy_clip_then_portrait_workflow.sh
# Run:   gcloud workflows run clip-then-portrait --data='{"vodId":"2843745368"}' --location=us-east1

main:
  params: [input]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: us-east1
          - vod_id: ${default(map.get(input, "vodId"), "2843745368")}
          - clip_job: ${"projects/" + project_id + "/locations/" + location + "/jobs/vod-clip-process"}
          - portrait_job: ${"projects/" + project_id + "/locations/" + location + "/jobs/vod-portrait-process"}

    - log_start:
        call: sys.log 
        args:
          text: ${"clip-then-portrait start vodId=" + vod_id}
          severity: INFO

    - run_clips:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${clip_job}
          body:
            overrides:
              containerOverrides:
                - args:
                    - cloud_job.py
                    - process-clips
                    - --vod-id
                    - ${vod_id}
                    - --cleanup
                    - --clean-work
          connector_params:
            timeout: 7200
        result: clip_op

    - run_portraits:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${portrait_job}
          body:
            overrides:
              containerOverrides:
                - args:
                    - cloud_job.py
                    - process-portraits
                    - --vod-id
                    - ${vod_id}
                    - --cleanup
                    - --clean-work
                    - --force
                    - --preset
                    - veryfast
                    - --crf
                    - "20"
          connector_params:
            timeout: 14400
        result: portrait_op

    - done:
        return:
          vodId: ${vod_id}
          clip: ${clip_op}
          portrait: ${portrait_op}
