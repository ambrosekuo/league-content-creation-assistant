# Cloud Workflow: archive (ingest+cut) → process-clips.
# Portraits are manual: run vod-portrait-process after weaves are ready.
# Deploy: gcloud workflows deploy archive-clip-portrait --location=us-east1 --source=deploy/workflow_archive_clip_portrait.yaml
# Run:   gcloud workflows run archive-clip-portrait --data='{"vodId":"2846435808"}' --location=us-east1

main:
  params: [input]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: us-east1
          - vod_id: ${default(map.get(input, "vodId"), "2846435808")}
          - archive_job: ${"projects/" + project_id + "/locations/" + location + "/jobs/vod-archive-nightly"}
          - clip_job: ${"projects/" + project_id + "/locations/" + location + "/jobs/vod-clip-process"}

    - log_start:
        call: sys.log
        args:
          text: ${"archive-then-clip start vodId=" + vod_id}
          severity: INFO

    - run_archive:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${archive_job}
          body:
            overrides:
              containerOverrides:
                - args:
                    - cloud_job.py
                    - process-vod
                    - --vod-id
                    - ${vod_id}
                    - --cleanup
                    - --fast
          connector_params:
            timeout: 86400
        result: archive_op

    - run_clips:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${clip_job}
          body:
            overrides:
              containerOverrides:
                - args:
                    - cloud_job.py
                    - process-clips
                    - --vod-id
                    - ${vod_id}
                    - --cleanup
                    - --clean-work
          connector_params:
            timeout: 7200
        result: clip_op

    - done:
        return:
          vodId: ${vod_id}
          archive: ${archive_op}
          clip: ${clip_op}
